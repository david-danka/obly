repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in sync with ruff in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # The leading ./ matters: without it, Windows can't find the
        # program when git starts the hook from its own shell.
        entry: ./.venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml$)
